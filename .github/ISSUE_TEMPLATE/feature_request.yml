name: Feature request
description: Propose a narrowly scoped compatibility or safety improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What compatibility gap or unsafe manual workflow needs improvement?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility impact
      description: Explain network mutations, credential exposure, restart behavior, and fallback behavior.
    validations:
      required: true
