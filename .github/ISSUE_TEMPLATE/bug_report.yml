name: 错误报告 / Bug report
description: 报告可复现的守护程序异常或兼容性问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿公开代理账号密码、令牌、用户名、主机名、IP 地址或未经脱敏的日志。安全漏洞请使用 GitHub Private Security Advisory 私下报告。
  - type: input
    id: version
    attributes:
      label: Guardian 版本
      placeholder: 1.4.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 操作系统、版本与架构
      placeholder: Windows 11 24H2 x64 / macOS 15 arm64 / Ubuntu 24.04 amd64
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex 来源与版本
      placeholder: Microsoft Store/MSIX、macOS ChatGPT/Codex app，或 Codex CLI
    validations:
      required: true
  - type: input
    id: proxy
    attributes:
      label: 代理软件与运行模式
      placeholder: 例如 Clash Verge Rev / Mihomo / v2rayN；HTTP、纯 SOCKS5、PAC/WPAD、混合端口、TUN 等
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Guardian 模式
      options: [Safe, Enforce]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供能够稳定复现问题的最短步骤。
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: 已脱敏的 Doctor 报告
      description: Windows 请粘贴 Doctor.ps1 -Online -Json；macOS/Linux 请粘贴 codex-proxy-guardian doctor。提交前人工检查一次。
      render: json
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为及已脱敏的状态/日志片段
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除账号密码、令牌、用户名、主机名以及内网/公网 IP 地址。
          required: true
