name: 错误报告 / Bug report
description: 报告可复现的守护程序异常或兼容性问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿公开代理账号密码、令牌、用户名、主机名、IP 地址或未经脱敏的日志。安全漏洞请使用 GitHub Private Security Advisory 私下报告。
        Codex 显示“正在重新连接”不等于 Guardian 重启了应用。请先对照同一时间的 Guardian 日志：只有出现 `codex_restart` 或 `proxy_changed` 时，Guardian 生命周期操作才可能相关；没有这两个事件时，请同时检查代理软件是否记录 TLS EOF、WebSocket reset、10054 或上游超时。
  - type: input
    id: version
    attributes:
      label: Guardian 版本
      placeholder: 1.5.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 操作系统、版本与架构
      placeholder: Windows 11 24H2 x64 / macOS 15 arm64 / Ubuntu 24.04 amd64
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex 来源与版本
      placeholder: Microsoft Store/MSIX、macOS ChatGPT/Codex app，或 Codex CLI
    validations:
      required: true
  - type: input
    id: proxy
    attributes:
      label: 代理软件与运行模式
      placeholder: 例如 Clash Verge Rev / Mihomo / v2rayN；HTTP、纯 SOCKS5、PAC/WPAD、混合端口、TUN 等
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Guardian 模式
      options: [Safe, Enforce]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供能够稳定复现问题的最短步骤。
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: 已脱敏的 Doctor 报告
      description: Windows 请粘贴 Doctor.ps1 -Online -Json；macOS/Linux 请粘贴 codex-proxy-guardian doctor。提交前人工检查一次。
      render: json
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为及已脱敏的状态/日志片段
      render: shell
    validations:
      required: true
  - type: dropdown
    id: reconnect_attribution
    attributes:
      label: 同一时间的 Guardian 日志是否出现 codex_restart 或 proxy_changed？
      description: 这用于区分 Guardian 生命周期操作与代理上游流式断连。
      options:
        - 没有；更像代理上游断流
        - 有；Guardian 生命周期操作可能相关
        - 尚未核对
    validations:
      required: true
  - type: input
    id: compatibility_state
    attributes:
      label: Codex 兼容审计状态
      description: 从 Status/Doctor 复制 CodexCompatibilityState、CodexCompatibilityEvidence 与 CompatibilityUpdateCheckState；不要粘贴原始代理地址。
      placeholder: Compatible / ProxyTrafficObserved / Requested
  - type: textarea
    id: provider_log
    attributes:
      label: 代理软件同一时间的脱敏日志（可选）
      description: 可粘贴 TLS EOF、WebSocket reset、10054、i/o timeout 等相关行；不要上传节点地址、订阅或账号信息。
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除账号密码、令牌、用户名、主机名以及内网/公网 IP 地址。
          required: true
