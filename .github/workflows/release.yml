name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and verify
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify tag matches VERSION
        shell: powershell
        run: |
          $version = (Get-Content -Raw -LiteralPath .\VERSION).Trim()
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag '$env:RELEASE_TAG' does not match VERSION '$version'."
          }
      - name: Build and test release archive
        shell: powershell
        run: .\tools\Package-Release.ps1
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw -LiteralPath .\VERSION).Trim()
          $assets = @(Get-ChildItem -LiteralPath .\artifacts -File | Sort-Object Name | Select-Object -ExpandProperty FullName)
          if ($assets.Count -lt 12) { throw "Expected at least 12 release assets, found $($assets.Count)." }
          $notesFile = ".\docs\releases\v$version.md"

          # In Windows PowerShell 5.1, gh writes a missing-release message to stderr.
          # Temporarily suppress native stderr promotion so the expected not-found case
          # reaches the create branch instead of terminating under ErrorActionPreference=Stop.
          $savedErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'SilentlyContinue'
          $releaseJson = & gh release view $env:RELEASE_TAG --json assets 2>$null
          $releaseViewExitCode = $LASTEXITCODE
          $ErrorActionPreference = $savedErrorActionPreference
          if ($releaseViewExitCode -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            $remoteAssets = @{}
            foreach ($remoteAsset in @($release.assets)) {
              $remoteAssets[[string]$remoteAsset.name] = $remoteAsset
            }

            $missingAssets = @()
            $payloads = @($assets | Where-Object { $_ -notlike '*.sha256' })
            foreach ($payload in $payloads) {
              $payloadName = Split-Path -Leaf $payload
              $checksum = "$payload.sha256"
              $checksumName = Split-Path -Leaf $checksum
              $hasPayload = $remoteAssets.ContainsKey($payloadName)
              $hasChecksum = $remoteAssets.ContainsKey($checksumName)
              if ($hasPayload -xor $hasChecksum) {
                throw "Existing release contains only one file from the '$payloadName' asset/checksum pair. Refusing an ambiguous repair."
              }
              if (-not $hasPayload) {
                $missingAssets += @($payload, $checksum)
              }
            }

            if ($missingAssets.Count -gt 0) {
              & gh release upload $env:RELEASE_TAG @missingAssets
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

            $verifyDirectory = Join-Path $env:RUNNER_TEMP "release-verify-$version"
            New-Item -ItemType Directory -Path $verifyDirectory -Force | Out-Null
            & gh release download $env:RELEASE_TAG --dir $verifyDirectory --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($payload in $payloads) {
              $payloadName = Split-Path -Leaf $payload
              $downloadedPayload = Join-Path $verifyDirectory $payloadName
              $downloadedChecksum = "$downloadedPayload.sha256"
              if (-not (Test-Path -LiteralPath $downloadedPayload -PathType Leaf) -or -not (Test-Path -LiteralPath $downloadedChecksum -PathType Leaf)) {
                throw "Release verification is missing '$payloadName' or its checksum."
              }
              $expectedDigest = ((Get-Content -Raw -LiteralPath $downloadedChecksum).Trim() -split '\s+')[0].ToLowerInvariant()
              $actualDigest = (Get-FileHash -LiteralPath $downloadedPayload -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($expectedDigest -ne $actualDigest) {
                throw "Release asset '$payloadName' does not match its published SHA-256 checksum."
              }
            }

            $arguments = @('release', 'edit', $env:RELEASE_TAG, '--verify-tag', '--title', "Codex Proxy Guardian $env:RELEASE_TAG")
            if (Test-Path -LiteralPath $notesFile) {
              $arguments += @('--notes-file', $notesFile)
            }
            if ($env:RELEASE_TAG -match '-') {
              $arguments += '--prerelease'
            }
            else {
              $arguments += @('--prerelease=false', '--latest')
            }
            & gh @arguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          else {
            $arguments = @('release', 'create', $env:RELEASE_TAG) + $assets + @('--verify-tag', '--title', "Codex Proxy Guardian $env:RELEASE_TAG")
            if (Test-Path -LiteralPath $notesFile) {
              $arguments += @('--notes-file', $notesFile)
            }
            else {
              $arguments += '--generate-notes'
            }
            if ($env:RELEASE_TAG -match '-') { $arguments += '--prerelease' }
            & gh @arguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
