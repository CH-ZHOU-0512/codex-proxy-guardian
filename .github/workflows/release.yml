name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify tag matches VERSION
        shell: powershell
        run: |
          $version = (Get-Content -Raw -LiteralPath .\VERSION).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' does not match VERSION '$version'."
          }
      - name: Build and test release archive
        shell: powershell
        run: .\tools\Package-Release.ps1
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw -LiteralPath .\VERSION).Trim()
          $assets = @(Get-ChildItem -LiteralPath .\artifacts -File | Sort-Object Name | Select-Object -ExpandProperty FullName)
          if ($assets.Count -lt 12) { throw "Expected at least 12 release assets, found $($assets.Count)." }
          $arguments = @('release', 'create', $env:GITHUB_REF_NAME) + $assets + @('--verify-tag', '--title', "Codex Proxy Guardian $env:GITHUB_REF_NAME")
          $notesFile = ".\docs\releases\v$version.md"
          if (Test-Path -LiteralPath $notesFile) {
            $arguments += @('--notes-file', $notesFile)
          }
          else {
            $arguments += '--generate-notes'
          }
          if ($env:GITHUB_REF_NAME -match '-') { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
