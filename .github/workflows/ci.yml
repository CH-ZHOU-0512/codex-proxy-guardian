name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test native guardian
        run: go test ./...
      - name: Build native guardian
        run: go build ./cmd/codex-proxy-guardian
      - name: Check install scripts
        if: runner.os != 'Windows'
        run: sh -n platform/install.sh && sh -n platform/uninstall.sh

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [windows-powershell, powershell]
    steps:
      - uses: actions/checkout@v7
      - name: Run tests on Windows PowerShell 5.1
        if: matrix.shell == 'windows-powershell'
        shell: powershell
        run: |
          .\tests\Run-Tests.ps1
          .\tests\Test-WinHttpPac.ps1
      - name: Run tests on PowerShell 7
        if: matrix.shell == 'powershell'
        shell: pwsh
        run: |
          .\tests\Run-Tests.ps1
          .\tests\Test-WinHttpPac.ps1

  package:
    runs-on: windows-latest
    needs: [test, go-test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release archive
        shell: powershell
        run: .\tools\Package-Release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: codex-proxy-guardian-${{ github.sha }}
          path: artifacts/*
